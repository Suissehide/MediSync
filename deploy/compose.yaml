name: medisync

networks:
  # Réseau externe partagé avec Traefik : réservé aux services exposés (back/front).
  proxy:
    name: proxy
    external: true
  # Réseau privé back <-> postgres. internal: true => aucune connectivité vers
  # l'extérieur ni depuis les autres stacks docker.
  medisync-internal:
    name: medisync-internal
    internal: true

services:
  back:
    build:
      context: ../back
      dockerfile: deploy/Dockerfile
      args:
        # Pas de DATABASE_URL au build : `prisma generate` n'a pas besoin d'une
        # vraie connexion (une URL factice est utilisée dans le Dockerfile).
        # La vraie URL n'est fournie qu'au runtime via `environment`.
        NODE_VERSION: ${NODE_VERSION}
        NPM_VERSION: ${NPM_VERSION}
      target: app
    image: "${CONTAINER_REGISTRY_PREFIX}${APP_IMAGE_NAME}-back:${VERSION:-latest}"
    container_name: "${APP_IMAGE_NAME}-back"
    ports:
      - '${PORT}:${PORT}'
    profiles:
      - backend
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:${PORT}/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - CORS_ORIGIN
      - DATABASE_URL
      - HOST
      - JWT_SECRET
      - JWT_REFRESH_SECRET
      - JWT_EXPIRES_IN
      - JWT_REFRESH_EXPIRES_IN
      - COOKIE_SECRET
      - LOG_LEVEL
      - NODE_CLUSTER
      - NODE_ENV=production
      - NODE_TLS_REJECT_UNAUTHORIZED
      - PORT
      - FRONT_URL
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${APP_IMAGE_NAME}-back.rule=Host(`${TRAEFIK_BACK_HOST}`)"
      - "traefik.http.routers.${APP_IMAGE_NAME}-back.entrypoints=https"
      - "traefik.http.routers.${APP_IMAGE_NAME}-back.tls=true"
      - "traefik.http.routers.${APP_IMAGE_NAME}-back.tls.certresolver=ovh"
      - "traefik.http.services.${APP_IMAGE_NAME}-back.loadbalancer.server.port=${PORT}"
    networks:
      - proxy
      - medisync-internal
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  front:
    build:
      context: ../front
      dockerfile: deploy/Dockerfile
      args:
        # Le front n'utilise pas DATABASE_URL : arg retiré pour ne pas fuiter le
        # mot de passe DB dans les layers de l'image.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        NODE_VERSION: ${NODE_VERSION}
        NPM_VERSION: ${NPM_VERSION}
    image: "${CONTAINER_REGISTRY_PREFIX}${APP_IMAGE_NAME}-front:${VERSION:-latest}"
    container_name: "${APP_IMAGE_NAME}-front"
    profiles:
      - frontend
    environment:
      - VITE_API_BASE_URL
      - VITE_ENVIRONMENT
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.${APP_IMAGE_NAME}-front.rule=Host(`${TRAEFIK_FRONT_HOST}`)"
      - "traefik.http.routers.${APP_IMAGE_NAME}-front.entrypoints=https"
      - "traefik.http.routers.${APP_IMAGE_NAME}-front.tls=true"
      - "traefik.http.routers.${APP_IMAGE_NAME}-front.tls.certresolver=ovh"
      - "traefik.http.services.${APP_IMAGE_NAME}-front.loadbalancer.server.port=80"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - proxy
    restart: unless-stopped

  postgres:
    container_name: "${APP_IMAGE_NAME}-postgres"
    image: postgres:16-alpine
    profiles:
      - db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $POSTGRES_DB_NAME -U ${POSTGRES_USER}"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    # Uniquement sur le réseau privé : plus joignable depuis le réseau proxy partagé.
    networks:
      - medisync-internal
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB_NAME}
    # Exposition limitée à la loopback de l'hôte (accès local/admin uniquement).
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    volumes:
      - postgres:/var/lib/postgresql/data

  # Sauvegarde locale : pg_dump quotidien avec rétention (7j + 4 hebdo + 6 mensuels).
  # NOTE: une copie chiffrée hors-serveur (ex. rclone vers un stockage objet S3)
  # reste à mettre en place manuellement — non implémentée ici.
  postgres-backup:
    container_name: "${APP_IMAGE_NAME}-postgres-backup"
    image: prodrigestivill/postgres-backup-local:16-alpine
    profiles:
      - db
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=${POSTGRES_DB_NAME}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - SCHEDULE=@daily
      - BACKUP_KEEP_DAYS=7
      - BACKUP_KEEP_WEEKS=4
      - BACKUP_KEEP_MONTHS=6
    volumes:
      - postgres-backups:/backups
    networks:
      - medisync-internal
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped


volumes:
  postgres:
    driver: local
  postgres-backups:
    driver: local
